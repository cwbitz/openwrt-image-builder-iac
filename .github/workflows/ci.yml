name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ansible:
    name: Ansible lint / syntax
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup mise (python + ansible-core from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Install control-node prerequisites + collections
        run: make install
      - name: Show the running lint tool versions
        run: |
          ansible-lint --version
          yamllint --version

      - name: Prepare Ansible vault password (throwaway; CI has no secrets)
        run: make vault-init
      - name: Prepare inventory from example
        run: |
          cp inventory/hosts.yml.example inventory/hosts.yml
          cp inventory/group_vars/builders/main.yml.example inventory/group_vars/builders/main.yml

      - name: Lint (syntax check + ansible-lint)
        run: make lint
      - name: Unit tests (pytest)
        run: make test
      - name: YAML lint
        run: yamllint -c .yamllint .ansible-lint requirements.yml playbooks roles inventory .github renovate.json
      - name: Verify the pinned Keychain asset (SHA256)
        run: make verify-keychain-pin
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
