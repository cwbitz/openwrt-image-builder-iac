name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ansible:
    name: Ansible lint / syntax
    runs-on: ubuntu-latest
    env:
      # Point Ansible at the project config; collections are installed into
      # ansible/collections (the path configured there). The vault password file
      # is intentionally NOT referenced, so no secret is needed for lint/CI.
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Single source of truth for the control-node toolchain: `.tool-versions`
      # pins python + ansible-core, so local and CI use the SAME versions.
      - name: Setup mise (python + ansible-core from .tool-versions)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install lint tooling
        run: pip install ansible-lint yamllint
      - name: Install collections
        run: ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
      - name: Prepare inventory from example
        run: cp ansible/inventory/hosts.yml.example ansible/inventory/hosts.yml
      - name: Syntax check
        run: |
          for p in ansible/playbooks/*.yml; do
            ansible-playbook --syntax-check -i ansible/inventory/hosts.yml "$p"
          done
      - name: Ansible lint
        run: ansible-lint -c ansible/.ansible-lint ansible
      - name: YAML lint
        run: yamllint -c .yamllint ansible .github renovate.json

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
