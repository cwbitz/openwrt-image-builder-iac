name: release-please

# Only runs on main. It opens/updates the release PR (version bump + CHANGELOG);
# the PR is merged by a human only after the required branch-protection checks
# pass (the `ci` workflow runs on every pull_request), which creates the tag and
# GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
