---
- name: Load the control-node private keys into the running SSH agent
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false
    agent_load_hosts: "{{ groups['builders'] | default([]) }}"
  tasks:
    - name: "[SSHAgent] Assert the Keychain ssh-agent is reachable in this shell"
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'SSH_AUTH_SOCK') | length > 0
        fail_msg: >-
          SSH_AUTH_SOCK is not set. Start the Keychain agent in this shell, or
          run the internal `make agent-load` to start it and load the connection
          keys now.

    - name: "[SSHAgent] Collect the configured private-key file paths (per identity)"
      ansible.builtin.set_fact:
        agent_privkey_files: >-
          {{ (agent_privkey_files | default([])) +
             [ hostvars[item].ssh_identities.iac.privkey | default('', true),
               hostvars[item].ssh_identities.admin.privkey | default('', true),
               hostvars[item].ssh_identities.root.privkey | default('', true) ] }}
      loop: "{{ agent_load_hosts }}"
      loop_control:
        label: "{{ item }}"

    - name: "[SSHAgent] Deduplicate the configured private-key paths"
      ansible.builtin.set_fact:
        agent_privkeys: >-
          {{ agent_privkey_files | select | unique | list }}

    - name: "[SSHAgent] Warn when no private-key paths are configured"
      ansible.builtin.debug:
        msg: >-
          No host_<id>_ssh_privkey_file values found (no hosts, or empty
          vaults). Nothing to load.
      when: agent_privkeys | length == 0

    - name: "[SSHAgent] Load the configured private keys"
      tags: [always]
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/helpers/tasks/load_agent_keys.yml"

    - name: "[SSHAgent] List the identities currently held by the agent"
      ansible.builtin.command: ssh-add -l
      changed_when: false
      failed_when: false
      register: agent_identities

    - name: "[SSHAgent] Agent identities"
      ansible.builtin.debug:
        msg: "{{ agent_identities.stdout_lines | default(['<none>']) }}"
