---
# Build a customized OpenWrt firmware image with the official ImageBuilder
# container. Run via `make build`.
#
# One inventory host = one build MACHINE; its build VARIANTS (target/profile/
# settings) are listed in host_vars/<machine>/main.yml as `build_variants`.
# Machine-wide connection settings/secrets live in group_vars/builder/. Run
# `make host-bootstrap` once per machine first (the connection identity is the
# `ansible` account). Re-running converges on the same output.
- name: "OpenWrt firmware image build"
  hosts: builder
  gather_facts: true
  become: false
  tasks:
    - name: "Build each variant of the machine"
      ansible.builtin.include_role:
        name: imagebuilder
      loop: "{{ build_variants }}"
      loop_control:
        loop_var: build_variant
        label: "{{ build_variant.name }}"
      tags: [always]

# Host security (opt-in): key-only SSH administration for the build machine.
- name: "Harden SSH (opt-in)"
  hosts: builder
  become: true
  gather_facts: true
  roles:
    - role: sshd
      tags: [sshd]
      when: sshd_hardening_enabled | default(false) | bool
