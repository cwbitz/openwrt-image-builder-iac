---
- name: "Preflight: assert a supported ansible-core engine"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: "[Preflight] Assert a supported ansible-core engine on the control node"
      ansible.builtin.assert:
        that:
          - ansible_version.full is version(ansible_core_min_version | default('2.19.0'), '>=')
          - (ansible_version.full is version(ansible_core_max_version | default('2.20.0'), '<')) or (ansible_core_allow_untested | default(false) | bool)
        fail_msg: >-
          ansible-core {{ ansible_version.full }} is outside the supported range
          [{{ ansible_core_min_version | default('2.19.0') }},
          {{ ansible_core_max_version | default('2.20.0') }}). Install the pinned
          toolchain (mise install / make install) or, if you knowingly accept an
          untested newer engine, set ansible_core_allow_untested=true.
        quiet: true

# Query the ImageBuilder image and profile information without building. Run
# via `make info`. One inventory host = one build MACHINE; it queries every
# variant listed in host_vars/<machine>/main.yml. Machine-wide connection
# settings live in group_vars/builder/; run `make host-bootstrap` once first.
- name: "OpenWrt ImageBuilder information"
  hosts: builder
  gather_facts: true
  become: false
  tasks:
    - name: "Query each variant of the machine"
      ansible.builtin.include_role:
        name: imagebuilder
        tasks_from: info
      loop: "{{ build_variants }}"
      loop_control:
        loop_var: build_variant
        label: "{{ build_variant.name }}"
