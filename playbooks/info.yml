---
# Query the ImageBuilder image and profile information without building. Run
# via `make info`. Connects as the `ansible` identity from host_vars (run
# `make host-bootstrap` once first).
- name: "OpenWrt ImageBuilder information"
  hosts: builder
  gather_facts: true
  become: false
  tasks:
    - name: Query ImageBuilder image and profile information
      ansible.builtin.include_role:
        name: imagebuilder
        tasks_from: info
