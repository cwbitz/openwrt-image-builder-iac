---
# ==============================================================================
# Build-host bootstrap (`make host-bootstrap`). Never part of build.yml /
# info.yml (those connect as the `ansible` identity directly).
#
# Probes the SSH identities in order [ansible, admin, root] for EVERY build
# machine and uses the first that works on each. If that is NOT `ansible`, it
# (re)creates the least-privilege `ansible` service account; if it already IS
# `ansible` it only applies the optional pubkey/sudo state. This self-heals a
# deleted/rotated credential.
#
# SSH public keys (per identity, opt-in): for every identity whose
# vault_host_{root,admin,ansible}_ssh_pubkey_file is set, the key at that
# control-node path is authorized for the matching account. Unset/empty ->
# skipped (keys are never auto-generated); paths only, never raw key strings.
#
# Service-account auth is exactly one of: a supplied public key (key auth), or a
# password; an empty vault_host_ansible_password is generated and merged back
# into the same vault under the same name. Passwords are hashed with a
# per-account random salt and applied with update_password=on_create, so re-runs
# are idempotent and a host-side rotation is preserved.
# ==============================================================================

# Preflight on the control node, before any connection: assert every managed host
# has a real address in the gitignored inventory (the committed template carries
# the CHANGE_ME_HOST_IP placeholder), so an unfilled entry fails with the fix
# command instead of an opaque SSH-resolution error. Tagged [always].
- name: "Preflight: verify the managed hosts are configured"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: "[Preflight] Require a real management address for every host"
      ansible.builtin.assert:
        that:
          - (hostvars[item].ansible_host | default('', true) | string | trim | length) > 0
          - >-
            (hostvars[item].ansible_host | default('', true) | string | trim)
            is not match('(?i)^(change_?me|todo)')
        fail_msg: |-
          { item }: ansible_host is
          '{ hostvars[item].ansible_host | default('<unset>', true) }', which is not a
          usable management address. Set the real address in the gitignored
          inventory/hosts.yml, or re-scaffold the host:
            make host-init HOST={{ item }} HOST_IP=<builder-address>
        quiet: true
      loop: "{{ groups['builder'] | default([]) }}"
      loop_control:
        label: "{{ item }}"

# Probe every build machine and inject the chosen identity per host (passwords
# via env, never argv). Runs on the control node.
- name: "Probe the SSH identities (ansible -> admin -> root) on every machine"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: "[Probe] Try each identity over SSH"
      ansible.builtin.shell: |
        set -u
        HOST="{{ hostvars[probe_host].ansible_host }}"; PORT="{{ hostvars[probe_host].ansible_port | default(22) }}"
        try_identity() {
          id="$1"
          user=$(eval echo "\$PROBE_${id}_USER")
          pw=$(eval echo "\$PROBE_${id}_PW")
          key=$(eval echo "\$PROBE_${id}_KEY")
          [ -z "$user" ] && return 1
          kopt=""; [ -n "$key" ] && kopt="-i $key"
          base="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -o Port=$PORT"
          base="$base -o PreferredAuthentications=publickey,password -o NumberOfPasswordPrompts=1"
          # An identity other than root must also be able to escalate: a
          # half-provisioned account can log in before its sudo access exists, and
          # choosing it then blocks the bootstrap from repairing the host. The
          # NOPASSWD service account is proven with `sudo -n true`; a password-sudo
          # identity (the `admin` account) proves escalation at deploy time via
          # ansible_become_password, so login is enough for it.
          remote="true"
          if [ "$id" != "ROOT" ] && [ -z "$pw" ]; then remote="sudo -n true"; fi
          if [ -n "$pw" ]; then
            SSHPASS="$pw" sshpass -e ssh $base $kopt "$user@$HOST" "$remote" >/dev/null 2>&1 && return 0
          else
            ssh $base -o BatchMode=yes $kopt "$user@$HOST" "$remote" >/dev/null 2>&1 && return 0
          fi
          return 1
        }
        for id in ANSIBLE ADMIN ROOT; do
          if try_identity "$id"; then echo "$id"; exit 0; fi
        done
        exit 1
      args:
        executable: /bin/bash
      environment:
        PROBE_ANSIBLE_USER: "{{ hostvars[probe_host].ssh_identities.ansible.user }}"
        PROBE_ANSIBLE_PW: "{{ hostvars[probe_host].ssh_identities.ansible.password }}"
        PROBE_ANSIBLE_KEY: "{{ hostvars[probe_host].ssh_identities.ansible.privkey }}"
        PROBE_ADMIN_USER: "{{ hostvars[probe_host].ssh_identities.admin.user }}"
        PROBE_ADMIN_PW: "{{ hostvars[probe_host].ssh_identities.admin.password }}"
        PROBE_ADMIN_KEY: "{{ hostvars[probe_host].ssh_identities.admin.privkey }}"
        PROBE_ROOT_USER: "{{ hostvars[probe_host].ssh_identities.root.user }}"
        PROBE_ROOT_PW: "{{ hostvars[probe_host].ssh_identities.root.password }}"
        PROBE_ROOT_KEY: "{{ hostvars[probe_host].ssh_identities.root.privkey }}"
      loop: "{{ groups['builder'] | default([]) }}"
      loop_control:
        loop_var: probe_host
        label: "{{ probe_host }}"
      register: probe
      changed_when: false
      no_log: true
      failed_when: false

    - name: "[Probe] Fail if a machine has no working identity"
      ansible.builtin.assert:
        that:
          - probe_result.rc == 0
        fail_msg: >-
          {{ probe_result.probe_host }}: could not log in as ansible, admin or
          root with the configured credentials. Check
          inventory/group_vars/builder/vault.yml
          (vault_host_{ansible,admin,root}_password / _ssh_privkey_file) and the
          host.
      loop: "{{ probe.results | default([]) }}"
      loop_control:
        loop_var: probe_result
        label: "{{ probe_result.probe_host }}"

    - name: "[Probe] Inject the chosen identity per machine"
      ansible.builtin.add_host:
        name: "{{ probe_result.probe_host }}"
        probe_identity: "{{ probe_result.stdout | trim }}"
        bootstrap_conn:
          user: >-
            {{ hostvars[probe_result.probe_host].ssh_identities[(probe_result.stdout | trim | lower)].user }}
          password: >-
            {{ hostvars[probe_result.probe_host].ssh_identities[(probe_result.stdout | trim | lower)].password }}
          privkey: >-
            {{ hostvars[probe_result.probe_host].ssh_identities[(probe_result.stdout | trim | lower)].privkey }}
          become: "{{ (probe_result.stdout | trim | lower) != 'root' }}"
      loop: "{{ probe.results | default([]) }}"
      loop_control:
        loop_var: probe_result
        label: "{{ probe_result.probe_host }}"

- name: Bootstrap the build machines (service + admin accounts, keys, sudo)
  hosts: builder
  gather_facts: true
  # The per-machine probed identity is applied as PLAY vars (add_host vars rank
  # below inventory host_vars, so they would not take effect there).
  vars:
    ansible_user: "{{ hostvars[inventory_hostname].bootstrap_conn.user }}"
    ansible_password: "{{ hostvars[inventory_hostname].bootstrap_conn.password }}"
    ansible_ssh_private_key_file: "{{ hostvars[inventory_hostname].bootstrap_conn.privkey }}"
    # root needs no escalation; ansible gets NOPASSWD sudo, admin password sudo.
    # This overrides the steady-state ansible_become from group_vars/builder/main.yml.
    bootstrap_become: "{{ hostvars[inventory_hostname].bootstrap_conn.become }}"
    ansible_become: "{{ bootstrap_become }}"
    # The admin identity may log in by key (empty SSH password) while its sudo
    # still requires the account password; reuse the identity's password for
    # become so escalation works. A wrong/empty value only matters when sudo is
    # not passwordless, in which case bootstrap fails loudly.
    ansible_become_password: "{{ hostvars[inventory_hostname].bootstrap_conn.password | default('', true) }}"
  become: "{{ bootstrap_become }}"
  tasks:
    # --------------------------------------------------------------------------
    # Service account: create/repair only when we did NOT connect as ansible.
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Resolve the service account settings"
      ansible.builtin.set_fact:
        bootstrap_service_user: "ansible"
        bootstrap_use_key: "{{ vault_host_ansible_ssh_pubkey_file | default('', true) | length > 0 }}"

    - name: "[Bootstrap] Generate the service-account password (no key supplied)"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: generate_shared_secrets
      vars:
        secrets_component: bootstrap
        secrets_vault_dir: "{{ vault_file | dirname }}"
        secrets_vault_file: "{{ vault_file | basename }}"
        secrets_list:
          - var: vault_host_ansible_password
            type: hex
            length: 24
      when: not (bootstrap_use_key | bool)

    - name: "[Bootstrap] Resolve the effective service-account password"
      ansible.builtin.set_fact:
        bootstrap_service_password: "{{ vault_host_ansible_password | default('', true) }}"
      no_log: true
      when: not (bootstrap_use_key | bool)

    - name: "[Bootstrap] Check whether the docker group exists"
      ansible.builtin.command: "getent group {{ ansible_service_docker_group | default('docker') }}"
      register: bootstrap_docker_group
      changed_when: false
      failed_when: false

    - name: "[Bootstrap] Resolve the service account's supplementary groups"
      ansible.builtin.set_fact:
        bootstrap_service_groups: >-
          {{ [ansible_service_docker_group | default('docker')]
             if bootstrap_docker_group.rc == 0 else [] }}

    - name: "[Bootstrap] Ensure the service account's group exists"
      ansible.builtin.group:
        name: "{{ bootstrap_service_user }}"
        gid: "{{ ansible_service_gid | default(6000) }}"

    - name: "[Bootstrap] Create/repair the service account"
      ansible.builtin.user:
        name: "{{ bootstrap_service_user }}"
        uid: "{{ ansible_service_uid | default(6000) }}"
        group: "{{ bootstrap_service_user }}"
        groups: "{{ bootstrap_service_groups }}"
        append: true
        shell: /bin/bash
        create_home: true
        home: "/home/{{ bootstrap_service_user }}"
        password: >-
          {{ (bootstrap_service_password | password_hash('sha512'))
             if not (bootstrap_use_key | bool) else omit }}
        update_password: on_create
      no_log: true
      when: hostvars[inventory_hostname].probe_identity | lower != 'ansible'

    # --------------------------------------------------------------------------
    # Admin identity (optional, opt-in via create_admin_account). A HUMAN operator
    # account: always gets a password (generated when empty) for console login
    # and sudo; a configured public key is installed additionally. Root always
    # exists and is never created.
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Resolve the admin identity settings"
      ansible.builtin.set_fact:
        bootstrap_admin: "{{ ssh_identities.admin }}"
        bootstrap_admin_defined: "{{ create_admin_account | default(false) | bool }}"

    - name: "[Bootstrap] Provision the admin password (enabled, none supplied)"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: generate_shared_secrets
      vars:
        secrets_component: bootstrap_admin
        secrets_vault_dir: "{{ vault_file | dirname }}"
        secrets_vault_file: "{{ vault_file | basename }}"
        secrets_list:
          - var: vault_host_admin_password
            type: hex
            length: 24
      when: bootstrap_admin_defined | bool

    - name: "[Bootstrap] Create/repair the admin account"
      ansible.builtin.user:
        name: "{{ bootstrap_admin.user }}"
        groups: "{{ bootstrap_service_groups }}"
        append: true
        shell: /bin/bash
        create_home: true
        state: present
        password: "{{ vault_host_admin_password | password_hash('sha512') }}"
        update_password: on_create
      no_log: true
      when:
        - bootstrap_admin_defined | bool
        - bootstrap_admin.user != 'root'
        - bootstrap_admin.user != bootstrap_service_user

    # --------------------------------------------------------------------------
    # SSH public keys (per identity, opt-in): authorize every explicitly
    # supplied vault_host_<id>_ssh_pubkey_file for its account. Empty/unset ->
    # ignored (never generated).
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Resolve the explicitly supplied public keys"
      ansible.builtin.set_fact:
        bootstrap_pubkey_specs: >-
          {%- set ns = namespace(specs=[]) -%}
          {%- for id, ident in ssh_identities.items() -%}
          {%-   if (id != 'admin' or (bootstrap_admin_defined | default(false) | bool))
                 and (ident.pubkey | default('') | string | trim) | length > 0 -%}
          {%-     set ns.specs = ns.specs + [{'id': id, 'user': ident.user, 'path': ident.pubkey}] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.specs }}

    - name: "[Bootstrap] Read the supplied public key files"
      ansible.builtin.slurp:
        src: "{{ pubkey_spec.path }}"
      register: bootstrap_pubkey_files
      delegate_to: localhost
      become: false
      loop: "{{ bootstrap_pubkey_specs }}"
      loop_control:
        loop_var: pubkey_spec
        label: "{{ pubkey_spec.id }}"

    - name: "[Bootstrap] Check that each public-key account exists"
      ansible.builtin.getent:
        database: passwd
        key: "{{ pubkey_spec.user }}"
      register: bootstrap_pubkey_users
      failed_when: false
      loop: "{{ bootstrap_pubkey_specs }}"
      loop_control:
        loop_var: pubkey_spec
        label: "{{ pubkey_spec.id }}"

    - name: "[Bootstrap] Fail if a public key targets a missing account"
      ansible.builtin.assert:
        that:
          - bootstrap_pubkey_users.results | default([])
            | selectattr('msg', 'defined') | selectattr('msg', 'ne', '') | list | length == 0
        fail_msg: >-
          vault_host_<id>_ssh_pubkey_file is set for account(s) that are not
          managed by this bootstrap and do not exist on {{ inventory_hostname }}:
          {{ bootstrap_pubkey_users.results | default([])
             | selectattr('msg', 'defined') | selectattr('msg', 'ne', '')
             | map(attribute='pubkey_spec.user') | join(', ') }}.
          Only the root, service (ansible) and explicitly configured admin
          accounts are provisioned; clear the pubkey path(s) or create the
          account(s) first.
      when: bootstrap_pubkey_specs | length > 0

    - name: "[Bootstrap] Ensure each account's .ssh directory exists"
      ansible.builtin.file:
        path: "{{ ('/root' if pubkey_file.pubkey_spec.user == 'root' else '/home/' ~ pubkey_file.pubkey_spec.user) }}/.ssh"
        state: directory
        owner: "{{ pubkey_file.pubkey_spec.user }}"
        group: "{{ pubkey_file.pubkey_spec.user }}"
        mode: "0700"
      loop: "{{ bootstrap_pubkey_files.results | default([]) }}"
      loop_control:
        loop_var: pubkey_file
        label: "{{ pubkey_file.pubkey_spec.id }}"

    - name: "[Bootstrap] Authorize each supplied public key for its account"
      ansible.posix.authorized_key:
        user: "{{ pubkey_file.pubkey_spec.user }}"
        key: "{{ pubkey_file.content | b64decode | trim }}"
        state: present
      loop: "{{ bootstrap_pubkey_files.results | default([]) }}"
      loop_control:
        loop_var: pubkey_file
        label: "{{ pubkey_file.pubkey_spec.id }}"

    # --------------------------------------------------------------------------
    # Sudo: NOPASSWD for the automation account; password sudo for the (optional)
    # human admin.
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Resolve the sudo accounts"
      ansible.builtin.set_fact:
        bootstrap_sudo_nopasswd_users: "{{ [bootstrap_service_user | default('ansible')] }}"
        bootstrap_sudo_password_users: >-
          {{ [bootstrap_admin.user]
             if (bootstrap_admin_defined | default(false) | bool
                 and bootstrap_admin.user | default('', true) != 'root'
                 and bootstrap_admin.user | default('', true) != (bootstrap_service_user | default('ansible')))
             else [] }}

    - name: "[Bootstrap] Ensure sudo is installed for the sudoers grants"
      # Minimal Debian images ship without the sudo package (/etc/sudoers.d may
      # not exist at all), yet the grants below, and the `become` the deploy
      # relies on, both need it.
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true
      when:
        - ansible_os_family == 'Debian'
        - (bootstrap_sudo_nopasswd_users | length
           + bootstrap_sudo_password_users | length) > 0

    - name: "[Bootstrap] Grant the automation account passwordless sudo"
      ansible.builtin.copy:
        content: "{{ item }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/90-openwrt-builder-{{ item }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      loop: "{{ bootstrap_sudo_nopasswd_users }}"
      when: bootstrap_sudo_nopasswd | default(true) | bool

    - name: "[Bootstrap] Grant the admin account password sudo"
      ansible.builtin.copy:
        content: "{{ item }} ALL=(ALL) ALL\n"
        dest: "/etc/sudoers.d/90-openwrt-builder-{{ item }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      loop: "{{ bootstrap_sudo_password_users }}"

    - name: "[Bootstrap] Report the outcome"
      ansible.builtin.debug:
        msg: >-
          Probed as '{{ hostvars[inventory_hostname].probe_identity }}'. Service
          account '{{ bootstrap_service_user }}'{{ " and admin account '" ~
          bootstrap_admin.user ~ "'" if bootstrap_admin_defined | bool else "" }}
          should exist; subsequent runs connect via vault_host_{ansible,admin,root}_*
          in inventory/host_vars/{{ inventory_hostname }}/vault.yml.
