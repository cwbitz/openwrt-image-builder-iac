[defaults]
inventory           = inventory/
roles_path          = ./roles
collections_path    = ./collections
home                = ./.cache/ansible
host_key_checking   = True
timeout             = 60
interpreter_python  = auto_silent
retry_files_enabled = False
gathering           = smart
fact_caching        = memory
forks               = 25
stdout_callback     = ansible.builtin.default
result_format       = yaml
force_color         = True
deprecation_warnings = False
callbacks_enabled   = ansible.builtin.profile_tasks
vault_password_file = ~/.config/projects/openwrt-image-builder-iac/ansible_vault_password

[ssh_connection]
pipelining = True
ssh_args   = -C -o ControlMaster=no -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new

[privilege_escalation]
become        = True
become_method = sudo

[diff]
always = True
