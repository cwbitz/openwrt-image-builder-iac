# Secret scanning for `make lint` and CI. The default ruleset stays complete;
# only committed placeholders, examples and installed collections are excluded.
[extend]
useDefault = true

[allowlist]
description = "Committed placeholders, examples and installed collections"
paths = [
  '''(^|/)host_vars/example/''',
  '''(^|/)modules/network/example\.env$''',
  '''\.example$''',
  '''^collections/''',
  '''^backup/''',
  '''^\.cache/''',
]
regexes = [
  '''CHANGE_ME_[A-Z_]*''',
]
