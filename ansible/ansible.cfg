[defaults]
# Ansible settings for the ImageBuilder orchestration. The builder host is the
# Docker host (localhost by default) where the openwrt/imagebuilder container
# runs. No changes needed normally.
inventory           = inventory/
roles_path          = ./roles:~/.ansible/roles
collections_path    = ./collections
host_key_checking   = False
# SSH/connection timeout in seconds (default 10 is too tight for a build host
# running long downloads; avoids "read operation timed out").
timeout             = 60
interpreter_python  = auto_silent
retry_files_enabled = False
gathering           = smart
# Cache facts in memory only. A persistent cache would survive across runs,
# but the connection user changes (root on the first run, then the 'ansible'
# automation user), so cached facts would misdirect the `become` decision in
# the role and the per-user build directory. Memory keeps facts fresh per run.
fact_caching        = memory
forks               = 25
stdout_callback     = ansible.builtin.default
result_format       = yaml
force_color         = True
deprecation_warnings = False
callbacks_enabled   = ansible.builtin.profile_tasks
# NOTE: the vault password file (kept OUTSIDE the repo) is NOT set here on
# purpose: ansible-core 2.19 fails when a configured vault_password_file is
# missing, which would break lint/CI on a fresh clone. The Makefile exports
# ANSIBLE_VAULT_PASSWORD_FILE only when the file exists; `make ans-vault-*`
# wraps ansible-vault for the operator.

[ssh_connection]
pipelining = True
# Keepalives detect dead peers. Connection multiplexing (ControlMaster) is
# intentionally OFF: long image builds have left stale master sockets behind.
ssh_args   = -C -o ControlMaster=no -o ServerAliveInterval=30 -o ServerAliveCountMax=4

[privilege_escalation]
become        = True
become_method = sudo

[diff]
always = True
