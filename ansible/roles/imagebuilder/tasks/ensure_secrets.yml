---
# Generate missing secrets into an encrypted vault (control-node side).
# Existing values are NEVER rotated. Params (via include vars):
#   ensure_secrets_component    message label
#   ensure_secrets_vault_file   encrypted vault path
#   ensure_secrets_list         [{ var, type: base64|hex, length }]
#   ensure_secrets_per_host     true when the vault is host_vars/<host>/...
# Ported from proxmox-iac (roles/pve/tasks/ensure_secrets.yml).

- name: Ensure openssl and ansible-vault are available on the control node
  delegate_to: localhost
  become: false
  block:
    - name: Check openssl
      ansible.builtin.shell: command -v openssl # noqa: command-instead-of-shell (command -v is a shell builtin)
      changed_when: false
      failed_when: false
      register: openssl_check

    - name: Check ansible-vault
      ansible.builtin.shell: command -v ansible-vault # noqa: command-instead-of-shell (command -v is a shell builtin)
      changed_when: false
      failed_when: false
      register: vault_check

    - name: Install openssl on the control node (best effort)
      when: openssl_check.rc != 0
      block:
        - name: Install openssl package
          ansible.builtin.package:
            name: openssl
            state: present
          become: true
      rescue:
        - name: Note openssl install failure
          ansible.builtin.debug:
            msg: >-
              openssl package install failed on the control node; will
              re-check below and fail if still unavailable.

    - name: Re-check openssl
      ansible.builtin.shell: command -v openssl # noqa: command-instead-of-shell (command -v is a shell builtin)
      changed_when: false
      failed_when: false
      register: openssl_recheck

    - name: Assert secret-provisioning prerequisites
      ansible.builtin.assert:
        that:
          - openssl_recheck.rc == 0
          - vault_check.rc == 0
        fail_msg: >-
          [{{ ensure_secrets_component | default('secrets') }}] openssl and
          ansible-vault are required on the control node. Install openssl
          and re-run.

- name: Validate secret provisioning contract
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.assert:
    that:
      - ensure_secrets_list is defined and ensure_secrets_list | length > 0
      - ensure_secrets_component is defined and ensure_secrets_component | string | trim | length > 0
      - ensure_secrets_vault_file is defined
      - ensure_secrets_vault_file is regex('^[a-zA-Z0-9_./-]+\.yml$')
      - ensure_secrets_list | map(attribute='var') | list | unique | length == ensure_secrets_list | length
      - ensure_secrets_list | map(attribute='var') | select('match', '^[a-zA-Z_][a-zA-Z0-9_]*$') | list | length == ensure_secrets_list | length
      - ensure_secrets_list | map(attribute='type') | list | unique | difference(['base64', 'hex']) | length == 0
      - ensure_secrets_list | map(attribute='length') | list | map('int') | select('<=', 0) | list | length == 0
      - not '..' in ensure_secrets_vault_file
    fail_msg: >-
      Invalid {{ ensure_secrets_component | default('secrets') }} call:
      ensure_secrets_list must be a non-empty list of {var, type: base64|hex,
      length>0} with unique, identifier-safe var names; ensure_secrets_vault_file
      a safe *.yml path without path traversal; ensure_secrets_component a
      non-empty string.

- name: Ensure secrets exist in the encrypted vault
  delegate_to: localhost
  become: false
  throttle: 1
  block:
    # Accept both encrypted ($ANSIBLE_VAULT header) and plaintext vaults: a
    # plaintext host vault keeps working until the operator encrypts it.
    - name: Read vault (decrypted or plaintext)
      ansible.builtin.shell: |
        set -u
        f={{ ensure_secrets_vault_file }}
        if [ -s "$f" ]; then
          hdr=$(head -c 16 "$f" 2>/dev/null || true)
          case "$hdr" in
            '$ANSIBLE_VAULT'*) ansible-vault view "$f" 2>/dev/null || true ;;
            *) cat "$f" 2>/dev/null || true ;;
          esac
        fi
      changed_when: false
      register: secrets_vault_content

    - name: Select missing secret definitions
      ansible.builtin.set_fact:
        secrets_missing: >-
          {%- set ns = namespace(missing=[]) -%}
          {%- for item in ensure_secrets_list -%}
          {%-   if secrets_vault_content.stdout | regex_search('^' ~ item.var ~ ':', multiline=True) is none -%}
          {%-     set ns.missing = ns.missing + [item] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.missing }}
      no_log: true

    - name: Generate missing secrets
      ansible.builtin.command: "openssl rand -{{ item.type }} {{ item.length | int }}"
      register: secret_gen
      changed_when: false
      no_log: true
      loop: "{{ secrets_missing }}"

    - name: Collect generated secret values
      ansible.builtin.set_fact:
        secret_values: >-
          {{ dict(
               secret_gen.results
                 | map(attribute='item') | map(attribute='var') | list
                 | zip(secret_gen.results | map(attribute='stdout') | map('trim') | list) | list) }}
      no_log: true
      when: secrets_missing | length > 0

    - name: Ensure vault parent directory exists
      ansible.builtin.file:
        path: "{{ ensure_secrets_vault_file | dirname }}"
        state: directory
        mode: "{{ '0700' if ensure_secrets_per_host | default(false) else '0755' }}"

    # Preserve the vault's format: re-encrypt an encrypted vault, keep a
    # plaintext vault plaintext (mode 0600) until the operator encrypts it.
    - name: Write generated secrets into the vault (preserving encryption)
      ansible.builtin.shell: |
        set -eu
        umask 077
        f={{ ensure_secrets_vault_file }}
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        encrypted=0
        if [ -s "$f" ]; then
          hdr=$(head -c 16 "$f" 2>/dev/null || true)
          case "$hdr" in
            '$ANSIBLE_VAULT'*)
              ansible-vault view "$f" > "$tmp"
              encrypted=1
              ;;
            *) cat "$f" > "$tmp" ;;
          esac
        else
          printf -- '---\n' > "$tmp"
        fi
        {% for item in ensure_secrets_list %}
        {% if secret_values is defined and secret_values.get(item.var) %}
        printf '%s: "%s"\n' '{{ item.var }}' '{{ secret_values[item.var] }}' >> "$tmp"
        {% endif %}
        {% endfor %}
        if [ "$encrypted" = "1" ]; then
          ansible-vault encrypt --output "$f" "$tmp"
        else
          install -m 0600 "$tmp" "$f"
        fi
      no_log: true
      changed_when: true
      when: secrets_missing | length > 0

    - name: Record generated secrets
      ansible.builtin.set_fact:
        generated_secrets: >-
          {{ (generated_secrets | default([])) +
             [{'name': item.var, 'value': secret_values[item.var]}] }}
      loop: "{{ secrets_missing }}"
      no_log: true
      when: secrets_missing | length > 0

- name: Load provisioned secrets into this run
  ansible.builtin.include_vars:
    file: "{{ ensure_secrets_vault_file }}"
  no_log: true

- name: Print auto-generated secrets
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.debug:
    msg: |
      Auto-generated secrets (stored in the host vault):
      {% for s in generated_secrets | default([]) %}- {{ s.name }} = {{ s.value }}
      {% endfor %}Vault password file: ~/.config/projects/openwrt-builder-wrapper/ansible_vault_password
      Store a copy of any generated password now; it is never shown again.
  when: generated_secrets | default([]) | length > 0
