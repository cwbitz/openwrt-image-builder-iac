---
# Provision the 'ansible' automation user on the build host, mirroring the
# proxmox-iac pve/users slice:
#   - a password is ALWAYS generated (into the encrypted host vault) so the
#     account stays reachable when no public key is configured;
#   - when host_ansible_ssh_pubkey_file is set, its key is installed and key
#     login is preferred (the password remains a fallback);
#   - passwordless sudo is granted, and the user is added to the docker group
#     when that group exists (so the Docker daemon is reachable without sudo).
#
# Run from the preflight: a fresh host is reached with root or an admin/sudo
# user, then subsequent runs can connect as 'ansible'. Disable with
# `provision_ansible_user: false`.
#
# This is a privileged operation: the connection user must have sudo (or be
# root) on the build host. `become` is disabled automatically when already root.

- name: Ensure the automation user's password exists in the host vault
  ansible.builtin.include_tasks: ensure_secrets.yml
  vars:
    ensure_secrets_component: users
    ensure_secrets_vault_file: "{{ host_vault_file }}"
    ensure_secrets_per_host: true
    ensure_secrets_list:
      - var: vault_host_ansible_password
        type: hex
        length: 24

- name: Check whether the docker group exists on the build host
  ansible.builtin.command: "getent group {{ host_ansible_docker_group }}"
  register: host_ansible_docker_group_lookup
  changed_when: false
  failed_when: false

- name: Resolve the automation user's supplementary groups
  ansible.builtin.set_fact:
    host_ansible_groups: "{{ [host_ansible_docker_group] if host_ansible_docker_group_lookup.rc == 0 else [] }}"

- name: Warn when the docker group is missing
  ansible.builtin.debug:
    msg: >-
      Group '{{ host_ansible_docker_group }}' does not exist on
      {{ inventory_hostname }}; the '{{ host_ansible_user }}' user is not added
      to it (Docker commands will run through sudo/become).
  when: host_ansible_docker_group_lookup.rc != 0

- name: Create the ansible automation user (password always set)
  ansible.builtin.user:
    name: "{{ host_ansible_user }}"
    uid: "{{ host_ansible_uid }}"
    shell: /bin/bash
    create_home: true
    home: "/home/{{ host_ansible_user }}"
    groups: "{{ host_ansible_groups }}"
    append: true
    password: "{{ vault_host_ansible_password | password_hash('sha512', 65534 | random(seed=inventory_hostname + vault_host_ansible_password) | string) }}"
  become: "{{ (ansible_facts.user_id | default('root')) != 'root' }}"
  no_log: true

- name: Install the ansible user's public key (key login preferred)
  ansible.posix.authorized_key:
    user: "{{ host_ansible_user }}"
    key: "{{ lookup('file', host_ansible_ssh_pubkey_file) }}"
    state: present
  become: "{{ (ansible_facts.user_id | default('root')) != 'root' }}"
  when: host_ansible_ssh_pubkey_file | default('') | string | length > 0

- name: Warn when no public key is configured (password-only login)
  ansible.builtin.debug:
    msg: >-
      host_ansible_ssh_pubkey_file (vault_host_ansible_ssh_pubkey_file) is
      unset: the '{{ host_ansible_user }}' user logs in with the generated
      password only. Set a key to prefer key login.
  when: host_ansible_ssh_pubkey_file | default('') | string | length == 0

- name: Grant the ansible user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ host_ansible_user }}"
    content: "{{ host_ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  become: "{{ (ansible_facts.user_id | default('root')) != 'root' }}"

- name: Report the provisioned automation user
  ansible.builtin.debug:
    msg: >-
      Provisioned '{{ host_ansible_user }}' (uid {{ host_ansible_uid }},
      groups {{ host_ansible_groups | join(',') | default('<none>', true) }},
      passwordless sudo). Key login: {{ 'yes' if host_ansible_ssh_pubkey_file | default('') | string | length > 0 else 'no (password only)' }}.
      Set `ansible_user: {{ host_ansible_user }}` in the inventory to use it.
