---
# Query the ImageBuilder image and profile information without building. Run
# via `make info`.
- name: "Select the connection user (probe, per builder host)"
  ansible.builtin.import_playbook: connect.yml

- name: "OpenWrt ImageBuilder information"
  hosts: builder
  gather_facts: true
  become: false
  roles:
    - role: imagebuilder
      tasks_from: info
