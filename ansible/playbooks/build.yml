---
# Build a customized OpenWrt firmware image with the official ImageBuilder
# container. Run via `make build`.
#
# Operator settings live in ansible/inventory/host_vars/<host>/main.yml
# (copy the .example); secrets live in the encrypted vault.yml next to it.
# The connection user is selected per host (ansible -> admin -> root).
# Re-running converges on the same output for the same inputs.
- name: "Select the connection user (probe, per builder host)"
  ansible.builtin.import_playbook: connect.yml

- name: "OpenWrt firmware image build"
  hosts: builder
  gather_facts: true
  become: false
  roles:
    - role: imagebuilder
