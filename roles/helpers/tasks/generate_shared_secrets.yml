---
- name: "[VaultSecrets] Check control-node prerequisites"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.include_tasks: control_node_prereqs.yml

- name: "[VaultSecrets] Validate the secret contract"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.assert:
    that:
      - secrets_list is defined and secrets_list | length > 0
      - secrets_component is defined and (secrets_component | string | trim) | length > 0
      - secrets_vault_dir is defined and (secrets_vault_dir | string | trim) | length > 0
      - secrets_vault_file is defined and (secrets_vault_file | string | trim) | length > 0
      - secrets_vault_file is regex('^[a-zA-Z0-9_.-]+\.yml$')
      - secrets_list | map(attribute='var') | list | unique | length == secrets_list | length
    fail_msg: >-
      Invalid {{ secrets_component | default('secrets') }}
      provisioning call: secrets_list must be a non-empty list with
      unique var names, secrets_vault_dir and secrets_vault_file must be
      non-empty (a safe *.yml filename), and secrets_component a non-empty
      string.
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: "[VaultSecrets] Validate each secret definition"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.assert:
    that:
      - item.var is defined and item.var is regex('^[a-zA-Z_][a-zA-Z0-9_]*$')
      - item.type is defined and item.type in ['base64', 'hex']
      - item.length is defined and (item.length | string) is regex('^[0-9]+$') and (item.length | int) > 0
    fail_msg: >-
      Invalid secret definition for {{ item.var | default('(undefined)') }} in
      {{ secrets_component | default('secrets') }}: var must
      match ^[a-zA-Z_][a-zA-Z0-9_]*$, type must be base64|hex, and length must
      be a positive integer.
  loop: "{{ secrets_list }}"
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: "[VaultSecrets] Read the vault"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.include_tasks: read_vault.yml
  vars:
    read_vault_dir: "{{ secrets_vault_dir }}"
    read_vault_file: "{{ secrets_vault_file }}"
    read_vault_var: secrets_shared_existing

- name: "[VaultSecrets] Determine which secrets are missing"
  tags: "{{ secrets_component | default('secrets') }}"
  ansible.builtin.set_fact:
    secrets_shared_missing: >-
      {%- set ns = namespace(missing=[]) -%}
      {%- for item in secrets_list -%}
      {%-   set value = (secrets_shared_existing | default({}, true)).get(item.var) -%}
      {%-   if (value is none) or ((value | string | trim) | length == 0) -%}
      {%-     set ns.missing = ns.missing + [item] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.missing }}
  no_log: true

- name: "[VaultSecrets] Generate and persist shared secrets"
  tags: "{{ secrets_component | default('secrets') }}"
  when: (secrets_shared_missing | default([], true)) | length > 0
  throttle: 1
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  block:
    - name: "[VaultSecrets] Ensure the vault directory exists"
      ansible.builtin.file:
        path: "{{ secrets_vault_dir }}"
        state: directory
        mode: "0700"

    - name: "[VaultSecrets] Generate missing shared secrets"
      ansible.builtin.command: "openssl rand -{{ item.type }} {{ item.length | int }}"
      register: secret_gen
      changed_when: false
      no_log: true
      loop: "{{ secrets_shared_missing }}"

    - name: "[VaultSecrets] Collect generated shared secret values"
      ansible.builtin.set_fact:
        secret_generated: >-
          {{ dict(secret_gen.results
            | map(attribute='item') | map(attribute='var') | list
            | zip(secret_gen.results
            | map(attribute='stdout') | map('regex_replace', '\s', '') | list) | list) }}
      no_log: true

    - name: "[VaultSecrets] Merge shared existing keys with newly generated secrets"
      ansible.builtin.set_fact:
        secrets_merged: >-
          {{ (secrets_shared_existing | default({}, true)) | combine(secret_generated) }}
      no_log: true

    - name: "[VaultSecrets] Write the merged keys into the vault file"
      ansible.builtin.include_tasks: write_vault.yml
      vars:
        write_vault_dir: "{{ secrets_vault_dir }}"
        write_vault_file: "{{ secrets_vault_file }}"
        write_vault_data: "{{ secrets_merged }}"

- name: "[VaultSecrets] Load the vault into this run"
  tags: "{{ secrets_component | default('secrets') }}"
  when: (secrets_shared_missing | default([], true)) | length > 0
  ansible.builtin.include_vars:
    file: "{{ secrets_vault_dir }}/{{ secrets_vault_file }}"
