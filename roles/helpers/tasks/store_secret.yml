---
- name: "[VaultStore] Validate the store contract"
  tags: [always]
  ansible.builtin.assert:
    that:
      - secret_store_file is defined and (secret_store_file | string | trim) | length > 0
      - secret_store_file is regex('^[a-zA-Z0-9_.-]+\.yml$')
      - secret_store_var is defined and secret_store_var is regex('^[a-zA-Z_][a-zA-Z0-9_]*$')
      - secret_store_value is defined and (secret_store_value | string | trim) | length > 0
    fail_msg: >-
      Invalid {{ secret_store_component | default('store_secret') }}
      store call: secret_store_file must be a safe *.yml filename,
      secret_store_var must match ^[a-zA-Z_][a-zA-Z0-9_]*$, and
      secret_store_value must be non-empty.
  run_once: true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: "[VaultStore] Read the existing target vault file"
  tags: [always]
  ansible.builtin.include_role:
    name: helpers
    tasks_from: read_vault
  vars:
    read_vault_dir: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    read_vault_file: "{{ secret_store_file }}"
    read_vault_var: secret_store_existing

- name: "[VaultStore] Determine whether the value is already stored"
  tags: [always]
  ansible.builtin.set_fact:
    secret_store_missing: >-
      {{ (((secret_store_existing | default({}, true)).get(secret_store_var) | default('', true) | string) | trim) | length == 0 }}
  no_log: true
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: "[VaultStore] Merge and persist the provided secret"
  tags: [always]
  when: secret_store_missing | bool
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
    secret_store_dir: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    secret_store_merged: >-
      {{ (secret_store_existing | default({}, true))
         | combine({secret_store_var: secret_store_value}) }}
  block:
    - name: "[VaultStore] Write the merged keys into the target vault file"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: write_vault
      vars:
        write_vault_dir: "{{ secret_store_dir }}"
        write_vault_file: "{{ secret_store_file }}"
        write_vault_data: "{{ secret_store_merged }}"
