---
# imagebuilder role internal defaults (fallback values). Operator-facing
# settings live in inventory/host_vars/<variant>/main.yml. The role
# resolves the active module set, collects packages, renders the uci-defaults
# overlay, and drives the openwrt/imagebuilder container.

# --- Internal path bases -----------------------------------------------------
# The repo root IS the Ansible root (flat layout). Derived from playbook_dir
# (playbooks/) via `dirname` so no path ever contains '..'.
project_root: "{{ playbook_dir | dirname }}"

# --- Build target ------------------------------------------------------------
# [REQUIRED] openwrt_image (e.g. openwrt/imagebuilder:x86-64-v23.05.5) is set
# in host_vars/<variant>/main.yml; the empty fallback fails the preflight.
openwrt_image: ""
openwrt_profile: ""
openwrt_force_pull: false

# --- Vaults (secrets) ---------------------------------------------------------
# Fallback per-host vault paths. This project actually groups variants by
# `builder` and overrides BOTH paths in inventory/group_vars/builder/main.yml so
# the machine-wide connection vault is shared by every variant; per-variant
# firmware secrets stay in host_vars/<variant>/vault.yml (auto-loaded by the
# inventory). Operator vault: hand-edited. Managed vault: written by
# `make host-bootstrap` (ensure_secrets) as encrypted "<var>_auto" values when
# the operator value is empty.
host_vault_file: "{{ project_root }}/inventory/host_vars/{{ inventory_hostname }}/vault.yml"
host_vault_managed_file: "{{ project_root }}/inventory/host_vars/{{ inventory_hostname }}/vault_managed.yml"

# --- Builder-side paths (on the managed build host) --------------------------
# The build host is normally a SEPARATE LAN machine from the control node, so
# these paths live on the builder. The overlay/script and the firmware images
# are produced here; retrieval to the control node is a separate step below.
openwrt_build_dir: "{{ ansible_facts.user_dir }}/.cache/openwrt-builder"
# Internal: scratch space for the rendered overlay and the in-container script.
# Paths are namespaced by inventory host (build variant) so multiple variants on
# the same build host can build in parallel without clobbering each other.
openwrt_workdir: "{{ openwrt_build_dir }}/work/{{ inventory_hostname }}"
# Firmware output on the builder (mounted as /builder/bin in the container).
openwrt_output_dir: "{{ openwrt_build_dir }}/artifacts/{{ inventory_hostname }}"

# --- Artifact retrieval (to the control node) --------------------------------
# When enabled, the built artifacts are pulled from the builder into
# openwrt_artifacts_dir on the CONTROL node, namespaced per variant under the
# project-root artifacts/ directory.
openwrt_fetch_artifacts: true
openwrt_artifacts_dir: "{{ project_root }}/artifacts/{{ inventory_hostname }}"

# --- Module selection --------------------------------------------------------
openwrt_default_modules:
  - base
  - system
  - root-password
  - pppoe
  - main-router
  - disable-ipv6
  - extras
openwrt_known_modules:
  - ap
  - base
  - bypass-router
  - disable-ipv6
  - extras
  - main-router
  - pppoe
  - prefer-ipv6
  - python
  - root-password
  - ssh-permission
  - statistics
  - system
openwrt_modules_adjust: []
openwrt_modules_override: []

# --- Packages ----------------------------------------------------------------
openwrt_extra_packages: []
openwrt_base_packages:
  - luci
  - "-dnsmasq"
  - dnsmasq-full
  - "-wpad-basic-mbedtls"
  - wpad-mbedtls
  - openssl-util
  - openssh-sftp-server
  - rsync
  - luci-i18n-base-zh-cn
  - luci-i18n-firewall-zh-cn
# The LuCI package-manager translation package differs by OpenWrt release.
openwrt_base_package_manager_pkg: luci-i18n-package-manager-zh-cn
openwrt_base_opkg_pkg: luci-i18n-opkg-zh-cn
openwrt_package_manager_min_version: "24.10"
# Internal: static package lists per module (base is version-aware and handled
# separately by packages.yml).
openwrt_module_packages:
  extras:
    - curl
    - vim-full
    - diffutils
    - bind-dig
    - nping
    - conntrack
    - tcpdump
  python:
    - python3-light
  statistics:
    - luci-app-statistics
    - collectd-mod-irq
    - collectd-mod-sensors

# --- Container limits --------------------------------------------------------
# The ImageBuilder host tools use fakeroot, whose `faked` daemon closes every
# file descriptor from 0 up to RLIMIT_NOFILE on startup. Docker inherits the
# daemon's (often near-infinite) nofile limit, which turns that loop into a
# billion-iteration spin that hangs the build. Pin a bounded limit.
openwrt_container_ulimits:
  - "nofile:65536:65536"

# --- Image customisation -----------------------------------------------------
openwrt_extra_image_name: ""
openwrt_disabled_services: ""
openwrt_rootfs_partsize: ""

# --- Mirrors -----------------------------------------------------------------
# Internal: USTC mirror used by setup.sh to fetch the ImageBuilder tarball.
# setup.sh builds "$UPSTREAM_URL/$VERSION_PATH/targets/...", and VERSION_PATH
# already contains 'releases/<ver>' or 'snapshots', so this root works for both
# release and SNAPSHOT images.
openwrt_setup_mirror_url: "https://mirrors.ustc.edu.cn/openwrt"
openwrt_setup_use_mirror: false
openwrt_use_mirror: false
# Rewrites only the host of the repository URLs, which already carry the
# 'releases/...' or 'snapshots/...' path; include the mirror's OpenWrt prefix.
openwrt_mirror: mirrors.tuna.tsinghua.edu.cn/openwrt

# --- Module variables (empty fallbacks; operator knobs per vars.yml.example) --
openwrt_main_lan_ip: ""
openwrt_pppoe_username: ""
openwrt_pppoe_password: ""
openwrt_root_password: ""
openwrt_ap_lan_ip: ""
openwrt_ap_gateway: ""
openwrt_ap_dns: []
openwrt_ap_disable_dhcp: false
openwrt_bypass_lan_ip: ""
openwrt_bypass_gateway: ""
openwrt_bypass_dns: []
openwrt_bypass_disable_dhcp: false

# --- Overlay file modes ------------------------------------------------------
# Relative overlay paths that must be executable on the device (uci-defaults).
# Every other overlay file is installed mode 0644.
openwrt_overlay_executable:
  - etc/uci-defaults/91-system
  - etc/uci-defaults/92-system
  - etc/uci-defaults/99-ssh
  - etc/uci-defaults/99-statistics
