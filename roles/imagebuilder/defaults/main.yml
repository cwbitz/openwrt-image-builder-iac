---
imagebuilder_image: "{{ (build_variant | default({})).imagebuilder_image | default('') }}"
target_profile: "{{ (build_variant | default({})).target_profile | default('') }}"
force_pull: "{{ (build_variant | default({})).force_pull | default(false) }}"
build_dir: "{{ ansible_facts.user_dir }}/.cache/openwrt-builder"
output_dir: "{{ build_dir }}/artifacts/{{ build_id }}"
# Control-node artifact directory. The name carries the backend, the target and
# the resolved version label (v<release> or SNAPSHOT), so a directory stays
# self-describing even when two IaC projects build the same machine with the
# same variant name.
artifact_id: >-
  {{ [build_id, 'imagebuilder',
      (build_target | default('unknown', true)) | replace('/', '-'),
      builder_version | default('unknown', true)] | join('-') }}
artifacts_dir: "{{ project_root }}/artifacts/{{ artifact_id }}"
packages: "{{ (build_variant | default({})).packages | default([]) }}"
custom_overlay: "{{ (build_variant | default({})).custom_overlay | default('') }}"
network: "{{ (build_variant | default({})).network | default({}) }}"
system:
  hostname: "{{ ((build_variant | default({})).system | default({})).hostname | default('') }}"
  timezone: "{{ ((build_variant | default({})).system | default({})).timezone | default('CST-8') }}"
  zonename: "{{ ((build_variant | default({})).system | default({})).zonename | default('Asia/Shanghai') }}"
statistics:
  interfaces: "{{ ((build_variant | default({})).statistics | default({})).interfaces | default([]) }}"
  sensors: "{{ ((build_variant | default({})).statistics | default({})).sensors | default(false) }}"
  irq: "{{ ((build_variant | default({})).statistics | default({})).irq | default(false) }}"
  rrd_timespans: "{{ ((build_variant | default({})).statistics | default({})).rrd_timespans | default(['2hour', '1day', '1week', '1month', '1year']) }}"
administration:
  root_password: "{{ ((build_variant | default({})).administration | default({})).root_password | default('') }}"
  ssh:
    interface: "{{ (((build_variant | default({})).administration | default({})).ssh | default({})).interface | default('') }}"
    port: "{{ (((build_variant | default({})).administration | default({})).ssh | default({})).port | default('') }}"
extra_firmware_name: "{{ (build_variant | default({})).extra_firmware_name | default('') }}"
disabled_services: "{{ (build_variant | default({})).disabled_services | default('') }}"
rootfs_partsize: "{{ (build_variant | default({})).rootfs_partsize | default('') }}"
use_mirror: "{{ (build_variant | default({})).use_mirror | default(false) }}"
mirror: "{{ (build_variant | default({})).mirror | default('https://mirrors.tuna.tsinghua.edu.cn/openwrt') }}"
