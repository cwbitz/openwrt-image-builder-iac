---
# imagebuilder role fallback values. Operator-facing settings live in
# inventory/host_vars/<variant>/main.yml. The role resolves the active module
# set, collects packages, renders the uci-defaults overlay, and drives the
# openwrt/imagebuilder container. Role-internal constants live in
# roles/imagebuilder/vars/main.yml.

# --- Build target ------------------------------------------------------------
# [REQUIRED] openwrt_image (e.g. openwrt/imagebuilder:x86-64-v23.05.5) is set
# in host_vars/<variant>/main.yml; the empty fallback fails the preflight.
openwrt_image: ""
openwrt_profile: ""
openwrt_force_pull: false

# --- Vaults (secrets) ---------------------------------------------------------
# Fallback per-host vault path. This project groups variants by `builder` and
# overrides it in inventory/group_vars/builder/main.yml so the machine-wide
# connection vault is shared by every variant; per-variant firmware secrets stay
# in host_vars/<variant>/vault.yml (auto-loaded by the inventory). The vault is
# hand-editable, and `make host-bootstrap` (ensure_secrets) merges any missing
# generated value into it under the same variable name.
host_vault_file: "{{ project_root }}/inventory/host_vars/{{ inventory_hostname }}/vault.yml"

# --- Builder-side paths (on the managed build host) --------------------------
# The build host is normally a SEPARATE LAN machine from the control node, so
# these paths live on the builder. The overlay/script and the firmware images
# are produced here; retrieval to the control node is a separate step below.
openwrt_build_dir: "{{ ansible_facts.user_dir }}/.cache/openwrt-builder"
# Firmware output on the builder (mounted as /builder/bin in the container).
openwrt_output_dir: "{{ openwrt_build_dir }}/artifacts/{{ inventory_hostname }}"

# --- Artifact retrieval (to the control node) --------------------------------
# When enabled, the built artifacts are pulled from the builder into
# openwrt_artifacts_dir on the CONTROL node, namespaced per variant under the
# project-root artifacts/ directory.
openwrt_fetch_artifacts: true
openwrt_artifacts_dir: "{{ project_root }}/artifacts/{{ inventory_hostname }}"

# --- Module selection --------------------------------------------------------
openwrt_modules_adjust: []
openwrt_modules_override: []

# --- Packages ----------------------------------------------------------------
openwrt_extra_packages: []

# --- Image customisation -----------------------------------------------------
openwrt_extra_image_name: ""
openwrt_disabled_services: ""
openwrt_rootfs_partsize: ""

# --- Mirrors -----------------------------------------------------------------
openwrt_setup_use_mirror: false
openwrt_use_mirror: false
# Rewrites only the host of the repository URLs, which already carry the
# 'releases/...' or 'snapshots/...' path; include the mirror's OpenWrt prefix.
openwrt_mirror: mirrors.tuna.tsinghua.edu.cn/openwrt

# --- Module variables (empty fallbacks; operator knobs per vars.yml.example) --
openwrt_main_lan_ip: ""
openwrt_pppoe_username: ""
openwrt_pppoe_password: ""
openwrt_root_password: ""
openwrt_ap_lan_ip: ""
openwrt_ap_gateway: ""
openwrt_ap_dns: []
openwrt_ap_disable_dhcp: false
openwrt_bypass_lan_ip: ""
openwrt_bypass_gateway: ""
openwrt_bypass_dns: []
openwrt_bypass_disable_dhcp: false
