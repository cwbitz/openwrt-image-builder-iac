---
- name: Initialize the package accumulator
  ansible.builtin.set_fact:
    packages_accumulator: []

- name: Add the base module packages
  ansible.builtin.set_fact:
    packages_accumulator: "{{ packages_accumulator + base_packages }}"
  when: "'base' in modules_active"

- name: Add the version-appropriate LuCI package-manager translation
  ansible.builtin.set_fact:
    packages_accumulator: >-
      {{ packages_accumulator
         + [ base_package_manager_pkg if (use_package_manager | bool)
             else base_opkg_pkg ] }}
  when: "'base' in modules_active"

- name: Add each active module's package list
  ansible.builtin.set_fact:
    packages_accumulator: "{{ packages_accumulator + module_packages[item] }}"
  loop: "{{ modules_active }}"
  loop_control:
    label: "{{ item }}"
  when: item in module_packages

- name: Append the operator extra packages
  ansible.builtin.set_fact:
    packages_accumulator: "{{ packages_accumulator + extra_packages }}"
  when: extra_packages | length > 0

- name: Deduplicate the package list (order preserving)
  ansible.builtin.set_fact:
    packages_final_list: "{{ packages_accumulator | unique }}"

- name: Detect packages that are both added and removed
  ansible.builtin.set_fact:
    package_conflicts: >-
      {{ packages_final_list
         | select('match', '^-')
         | map('regex_replace', '^-', '')
         | select('in', packages_final_list)
         | list }}

- name: Assert there are no package conflicts
  ansible.builtin.assert:
    that:
      - package_conflicts | length == 0
    fail_msg: >-
      Packages are both added and removed:
      {{ package_conflicts | join(', ') }}.

- name: Render the final PACKAGES string
  ansible.builtin.set_fact:
    packages_final: "{{ packages_final_list | join(' ') }}"

- name: Show the resolved package list
  ansible.builtin.debug:
    msg: "PACKAGES={{ packages_final }}"
