---
- name: Ensure the artifact output directory exists
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: "0755"

- name: Render the in-container build script
  ansible.builtin.template:
    src: build.sh.j2
    dest: "{{ builder_workdir }}/build.sh"
    mode: "0755"

- name: Build the firmware image in the ImageBuilder container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ imagebuilder_image }}"
    user: "0:0"
    working_dir: /builder
    command: ["/bin/bash", "/builder/build.sh"]
    detach: false
    cleanup: true
    output_logs: true
    ulimits: "{{ container_ulimits }}"
    volumes:
      - "{{ output_dir }}:/builder/bin"
      - "{{ builder_workdir }}/build.sh:/builder/build.sh"
      - "{{ builder_workdir }}/files:/builder/files"
    env:
      HOST_UID: "{{ ansible_user_uid | string }}"
      HOST_GID: "{{ ansible_user_gid | string }}"
      OPENWRT_PACKAGES: "{{ packages_final }}"
      OPENWRT_PROFILE: "{{ target_profile }}"
      OPENWRT_EXTRA_IMAGE_NAME: "{{ extra_image_name }}"
      OPENWRT_DISABLED_SERVICES: "{{ disabled_services }}"
      OPENWRT_ROOTFS_PARTSIZE: "{{ rootfs_partsize }}"
  register: build_result

- name: Show the ImageBuilder build log
  ansible.builtin.debug:
    msg: "{{ build_result.container.Output | default('', true) | split('\n') }}"

- name: Assert the build succeeded
  ansible.builtin.assert:
    that:
      - build_result.status | default(1) | int == 0
    fail_msg: >-
      The ImageBuilder container exited with a non-zero status; review the build
      log above.

- name: Locate the generated artifacts on the builder
  ansible.builtin.find:
    paths: "{{ output_dir }}"
    file_type: file
    recurse: true
  register: build_artifacts

- name: List the generated artifacts
  ansible.builtin.debug:
    msg: "{{ build_artifacts.files | map(attribute='path') | list }}"

- name: Compute the artifact paths relative to the builder output directory
  ansible.builtin.set_fact:
    artifact_relpaths: >-
      {{ build_artifacts.files | map(attribute='path')
         | map('relpath', output_dir) | list }}
  when: fetch_artifacts | bool

- name: Ensure the control-node artifact directories exist
  ansible.builtin.file:
    path: "{{ artifacts_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ artifact_relpaths | map('dirname') | unique | list }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when: fetch_artifacts | bool

- name: Fetch the generated artifacts to the control node
  ansible.builtin.fetch:
    src: "{{ output_dir }}/{{ item }}"
    dest: "{{ artifacts_dir }}/{{ item }}"
    flat: true
  loop: "{{ artifact_relpaths }}"
  when: fetch_artifacts | bool

- name: Report where the artifacts were delivered
  ansible.builtin.debug:
    msg: >-
      {{ 'Artifacts fetched to ' ~ artifacts_dir
         if (fetch_artifacts | bool)
         else 'Artifacts left on the builder at ' ~ output_dir }}
