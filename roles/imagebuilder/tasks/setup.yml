---
- name: Ensure the ImageBuilder Docker image is present
  community.docker.docker_image:
    name: "{{ imagebuilder_image }}"
    source: pull
    force_source: "{{ force_pull | bool }}"
  register: image_pull

- name: Read the ImageBuilder image metadata
  community.docker.docker_image_info:
    name: "{{ imagebuilder_image }}"
  register: image_info

- name: Extract the image environment
  ansible.builtin.set_fact:
    image_env: "{{ image_info.images[0].Config.Env | default([]) }}"

- name: Assert the image exposes VERSION_PATH and TARGET
  ansible.builtin.assert:
    that:
      - image_info.images | length > 0
      - image_env | select('match', '^VERSION_PATH=') | list | length > 0
      - image_env | select('match', '^TARGET=') | list | length > 0
    fail_msg: >-
      The image '{{ imagebuilder_image }}' does not expose VERSION_PATH/TARGET in its
      environment. Use an official openwrt/imagebuilder tag.

- name: Derive the version path, target and version label from the image
  ansible.builtin.set_fact:
    builder_version_path: "{{ version_path }}"
    builder_version: >-
      {{ 'SNAPSHOT' if 'snapshot' in (version_path | lower)
         else 'v' ~ (version_path | basename | regex_replace('^v', '')) }}
    build_target: >-
      {{ (image_env | select('match', '^TARGET=') | first).split('=', 1)[1] }}
    build_target_name: >-
      {{ ((image_env | select('match', '^TARGET=') | first).split('=', 1)[1]) | replace('/', '-') }}
  vars:
    version_path: >-
      {{ (image_env | select('match', '^VERSION_PATH=') | first).split('=', 1)[1] }}

- name: Derive the setup path and container name
  ansible.builtin.set_fact:
    setup_version_path: >-
      {{ 'snapshots' if 'snapshot' in (builder_version_path | lower) else builder_version_path }}
    container_name: "openwrt-ib-{{ build_target_name }}-{{ builder_version }}"

- name: Show the detected build target
  ansible.builtin.debug:
    msg: >-
      Image {{ imagebuilder_image }} => target {{ build_target }},
      version {{ builder_version }} (container {{ container_name }})
