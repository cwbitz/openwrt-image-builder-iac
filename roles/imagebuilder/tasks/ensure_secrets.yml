---
# Generate missing secrets into the automation-managed vault (control-node side).
# The operator vault (ensure_secrets_vault_file) is READ-ONLY: a listed variable
# that is empty/undefined there is generated and stored in the managed vault
# (ensure_secrets_managed_file) as "<var>_auto". Existing non-empty _auto values
# are preserved (never rotated) and the managed vault is always encrypted.
# Params (via include vars):
#   ensure_secrets_component     message label
#   ensure_secrets_vault_file    operator vault (read-only), e.g. vault.yml
#   ensure_secrets_managed_file  managed vault (read/write), e.g. vault_managed.yml
#   ensure_secrets_list          [{ var, type: base64|hex, length }]
#   ensure_secrets_per_host      true when the managed vault is host-scoped (0600 dir)
# Ported from proxmox-iac (roles/pve/tasks/ensure_secrets.yml).

- name: Ensure openssl and ansible-vault are available on the control node
  delegate_to: localhost
  become: false
  block:
    - name: Check openssl
      ansible.builtin.shell: command -v openssl # noqa: command-instead-of-shell (command -v is a shell builtin)
      changed_when: false
      failed_when: false
      register: openssl_check

    - name: Check ansible-vault
      ansible.builtin.shell: command -v ansible-vault # noqa: command-instead-of-shell (command -v is a shell builtin)
      changed_when: false
      failed_when: false
      register: vault_check

    - name: Install openssl on the control node (best effort)
      when: openssl_check.rc != 0
      block:
        - name: Install openssl package
          ansible.builtin.package:
            name: openssl
            state: present
          become: true
      rescue:
        - name: Note openssl install failure
          ansible.builtin.debug:
            msg: >-
              openssl package install failed on the control node; will
              re-check below and fail if still unavailable.

    - name: Re-check openssl
      ansible.builtin.shell: command -v openssl # noqa: command-instead-of-shell (command -v is a shell builtin)
      changed_when: false
      failed_when: false
      register: openssl_recheck

    - name: Assert secret-provisioning prerequisites
      ansible.builtin.assert:
        that:
          - openssl_recheck.rc == 0
          - vault_check.rc == 0
        fail_msg: >-
          [{{ ensure_secrets_component | default('secrets') }}] openssl and
          ansible-vault are required on the control node. Install openssl
          and re-run.

- name: Validate secret provisioning contract
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.assert:
    that:
      - ensure_secrets_list is defined and ensure_secrets_list | length > 0
      - ensure_secrets_component is defined and ensure_secrets_component | string | trim | length > 0
      - ensure_secrets_vault_file is defined
      - ensure_secrets_vault_file is regex('^[a-zA-Z0-9_./-]+\.yml$')
      - ensure_secrets_managed_file is defined
      - ensure_secrets_managed_file is regex('^[a-zA-Z0-9_./-]+\.yml$')
      - ensure_secrets_managed_file != ensure_secrets_vault_file
      - ensure_secrets_list | map(attribute='var') | list | unique | length == ensure_secrets_list | length
      - ensure_secrets_list | map(attribute='var') | select('match', '^[a-zA-Z_][a-zA-Z0-9_]*$') | list | length == ensure_secrets_list | length
      - ensure_secrets_list | map(attribute='type') | list | unique | difference(['base64', 'hex']) | length == 0
      - ensure_secrets_list | map(attribute='length') | list | map('int') | select('<=', 0) | list | length == 0
      - not '..' in ensure_secrets_vault_file
      - not '..' in ensure_secrets_managed_file
    fail_msg: >-
      Invalid {{ ensure_secrets_component | default('secrets') }} call:
      ensure_secrets_list must be a non-empty list of {var, type: base64|hex,
      length>0} with unique, identifier-safe var names; ensure_secrets_vault_file
      and ensure_secrets_managed_file must be distinct safe *.yml paths without
      path traversal; ensure_secrets_component a non-empty string.

# The shell tasks below run with their cwd set to the playbook directory, so
# `ansible-vault` cannot discover ansible.cfg on its own. Resolve the configured
# vault password file from the loaded config and pass it explicitly.
- name: Resolve the configured vault password file
  delegate_to: localhost
  become: false
  ansible.builtin.set_fact:
    ensure_secrets_vault_password_file: >-
      {{ lookup('ansible.builtin.config', 'DEFAULT_VAULT_PASSWORD_FILE') | default('', true) }}
  no_log: true

- name: Ensure secrets exist in the managed vault
  delegate_to: localhost
  become: false
  throttle: 1
  block:
    # Accept both encrypted ($ANSIBLE_VAULT header) and plaintext vaults: a
    # plaintext operator vault keeps working until the operator encrypts it.
    - name: Read the operator vault (decrypted or plaintext)
      ansible.builtin.shell: |
        set -u
        f={{ ensure_secrets_vault_file }}
        vpf={{ ensure_secrets_vault_password_file }}
        if [ -n "$vpf" ]; then vopt="--vault-password-file=$vpf"; else vopt=""; fi
        if [ -s "$f" ]; then
          hdr=$(head -c 16 "$f" 2>/dev/null || true)
          case "$hdr" in
            '$ANSIBLE_VAULT'*) ansible-vault view $vopt "$f" 2>/dev/null || true ;;
            *) cat "$f" 2>/dev/null || true ;;
          esac
        fi
      changed_when: false
      register: secrets_operator_content

    - name: Read the managed vault (decrypted or plaintext)
      ansible.builtin.shell: |
        set -u
        f={{ ensure_secrets_managed_file }}
        vpf={{ ensure_secrets_vault_password_file }}
        if [ -n "$vpf" ]; then vopt="--vault-password-file=$vpf"; else vopt=""; fi
        if [ -s "$f" ]; then
          hdr=$(head -c 16 "$f" 2>/dev/null || true)
          case "$hdr" in
            '$ANSIBLE_VAULT'*) ansible-vault view $vopt "$f" 2>/dev/null || true ;;
            *) cat "$f" 2>/dev/null || true ;;
          esac
        fi
      changed_when: false
      register: secrets_managed_content

    - name: Load operator and managed vault mappings
      ansible.builtin.set_fact:
        secrets_operator: "{{ secrets_operator_content.stdout | default('') | from_yaml | default({}, true) }}"
        secrets_managed: "{{ secrets_managed_content.stdout | default('') | from_yaml | default({}, true) }}"
      no_log: true

    # A variable counts as missing when it is empty/undefined in the operator
    # vault AND no managed "_auto" value exists yet (existing values are never
    # rotated).
    - name: Select secrets to generate
      ansible.builtin.set_fact:
        secrets_missing: >-
          {%- set ns = namespace(missing=[]) -%}
          {%- for item in ensure_secrets_list -%}
          {%-   set declared = secrets_operator.get(item.var) -%}
          {%-   set managed = secrets_managed.get(item.var ~ '_auto') -%}
          {%-   if ((declared is none) or ((declared | string | trim) | length == 0))
                   and ((managed is none) or ((managed | string | trim) | length == 0)) -%}
          {%-     set ns.missing = ns.missing + [item] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.missing }}
      no_log: true

    - name: Generate missing secrets
      ansible.builtin.command: "openssl rand -{{ item.type }} {{ item.length | int }}"
      register: secret_gen
      changed_when: false
      no_log: true
      loop: "{{ secrets_missing }}"

    - name: Collect generated secret values
      ansible.builtin.set_fact:
        secret_values: >-
          {{ dict(
               secret_gen.results
                 | map(attribute='item') | map(attribute='var') | list
                 | zip(secret_gen.results | map(attribute='stdout') | map('trim') | list) | list) }}
      no_log: true
      when: secrets_missing | length > 0

    - name: Ensure managed vault parent directory exists
      ansible.builtin.file:
        path: "{{ ensure_secrets_managed_file | dirname }}"
        state: directory
        mode: "{{ '0700' if ensure_secrets_per_host | default(false) else '0755' }}"

    # The managed vault is always encrypted: it holds machine-generated secrets.
    # A pre-existing encrypted managed vault is decrypted and re-encrypted so its
    # other "_auto" keys are preserved and all callers can safely target it.
    - name: Write generated secrets into the managed vault (always encrypted)
      ansible.builtin.shell: |
        set -eu
        umask 077
        f={{ ensure_secrets_managed_file }}
        vpf={{ ensure_secrets_vault_password_file }}
        if [ -n "$vpf" ]; then vopt="--vault-password-file=$vpf"; else vopt=""; fi
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        if [ -s "$f" ]; then
          hdr=$(head -c 16 "$f" 2>/dev/null || true)
          case "$hdr" in
            '$ANSIBLE_VAULT'*) ansible-vault view $vopt "$f" > "$tmp" ;;
            *) cat "$f" > "$tmp" ;;
          esac
        else
          printf -- '---\n' > "$tmp"
        fi
        {% for item in ensure_secrets_list %}
        {% if secret_values is defined and secret_values.get(item.var) %}
        printf '%s: "%s"\n' '{{ item.var }}_auto' '{{ secret_values[item.var] }}' >> "$tmp"
        {% endif %}
        {% endfor %}
        ansible-vault encrypt $vopt --output "$f" "$tmp"
      no_log: true
      changed_when: true
      when: secrets_missing | length > 0

    - name: Stat the managed vault
      ansible.builtin.stat:
        path: "{{ ensure_secrets_managed_file }}"
      register: secrets_managed_stat

    - name: Record generated secrets
      ansible.builtin.set_fact:
        generated_secrets: >-
          {{ (generated_secrets | default([])) +
             [{'name': item.var ~ '_auto', 'value': secret_values[item.var]}] }}
      loop: "{{ secrets_missing }}"
      no_log: true
      when: secrets_missing | length > 0

- name: Load the managed vault into this run
  ansible.builtin.include_vars:
    file: "{{ ensure_secrets_managed_file }}"
  no_log: true
  when: secrets_missing | length > 0 or secrets_managed_stat.stat.exists

- name: Print auto-generated secrets
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.debug:
    msg: |
      Auto-generated secrets (stored in the managed host vault):
      {% for s in generated_secrets | default([]) %}- {{ s.name }} = {{ s.value }}
      {% endfor %}Vault file: {{ ensure_secrets_managed_file }}
      Vault password file: {{ ensure_secrets_vault_password_file | default('(from ansible.cfg)') }}
      Store a copy of any generated password now; it is never shown again.
  when: generated_secrets | default([]) | length > 0
