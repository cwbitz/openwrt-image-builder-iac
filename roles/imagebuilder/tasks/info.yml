---
- name: Check the build host prerequisites and required settings
  ansible.builtin.import_tasks: preflight.yml

- name: Ensure the ImageBuilder image and derive its version/target
  ansible.builtin.import_tasks: setup.yml

- name: Query ImageBuilder image and profile information
  community.docker.docker_container:
    name: "{{ container_name }}-info"
    image: "{{ imagebuilder_image }}"
    user: "0:0"
    working_dir: /builder
    command: ["make", "info"]
    detach: false
    cleanup: true
    keep_volumes: false
    output_logs: true
    ulimits: "{{ container_ulimits }}"
  register: target_info

- name: Show the ImageBuilder information
  ansible.builtin.debug:
    msg: "{{ ['== ' ~ build_id ~ ' =='] + (target_info.container.Output | default('', true) | split('\n')) }}"
  tags: [imagebuilder_info]
