---
- name: Assert module entries are mappings
  ansible.builtin.assert:
    that:
      - ((build_variant | default({})).get(item) | default({})) is mapping
    fail_msg: "Module '{{ item }}' must be a mapping with an 'enabled' flag."
  loop: "{{ module_names }}"
  loop_control:
    label: "{{ item }}"

- name: Start with no active modules
  ansible.builtin.set_fact:
    modules_active: []

- name: Add enabled modules
  ansible.builtin.set_fact:
    modules_active: >-
      {{ modules_active
         + ([item] if (((build_variant | default({})).get(item) | default({})).get('enabled', false) | bool) else []) }}
  loop: "{{ module_names }}"
  loop_control:
    label: "{{ item }}"

- name: Show the active module set
  ansible.builtin.debug:
    msg: "Active modules: {{ modules_active | join(' ') }}"
