---
- name: Assert override entries are module names (no '-' prefix)
  ansible.builtin.assert:
    that:
      - modules_override | select('match', '^-') | list | length == 0
    fail_msg: >-
      modules_override must list module names only; removals are not
      allowed there (use modules_adjust for add/remove).

- name: Start from the default module set
  ansible.builtin.set_fact:
    modules_active: "{{ default_modules }}"
  when: modules_override | length == 0

- name: Start from the explicit override list
  ansible.builtin.set_fact:
    modules_active: "{{ modules_override }}"
  when: modules_override | length > 0

- name: Apply add/remove adjustments to the module set
  ansible.builtin.set_fact:
    modules_active: >-
      {{
        (modules_active | reject('eq', item[1:]) | list)
        if (item.startswith('-'))
        else
        (modules_active if item in modules_active
         else modules_active + [item])
      }}
  loop: "{{ modules_adjust }}"
  loop_control:
    label: "{{ item }}"
  when: modules_override | length == 0

- name: Assert every active module is known
  ansible.builtin.assert:
    that:
      - item in known_modules
    fail_msg: >-
      Unknown module '{{ item }}'. Known modules:
      {{ known_modules | join(', ') }}.
  loop: "{{ modules_active }}"
  loop_control:
    label: "{{ item }}"

- name: Show the resolved module set
  ansible.builtin.debug:
    msg: "Active modules: {{ modules_active | join(' ') }}"
