---
# ==============================================================================
# Shared configuration for every host in the `builder` group
# (inventory/group_vars/builder/main.yml)
# ==============================================================================
# This project models "build variants" as multiple inventory hosts that all
# point at the SAME physical build machine (one inventory host per
# target/profile/setting combination). Everything that is a property of the
# MACHINE — not of a single variant — lives here so it is not duplicated across
# host_vars/<variant>/main.yml:
#
#   * the SSH connection identity (probe order ansible -> admin -> root),
#   * the `ansible` service account's uid/gid and docker group,
#   * the shared connection vault (one per machine, not per variant).
#
# Per-variant build settings (openwrt_image, openwrt_profile, packages, LAN IP,
# ...) live in inventory/host_vars/<variant>/main.yml. See host_vars/example/.
# Per-variant scratch/output isolation is a role default (see
# roles/imagebuilder/defaults/main.yml), so it works for any inventory layout.

# --- SSH connection identity -------------------------------------------------
# `make host-bootstrap` probes [ansible, admin, root] and uses the first that
# works; normal runs (build/info) always connect as `ansible`. Each identity may
# set a password AND/OR a private key file; SSH prefers the key, then falls back
# to a password. Only paths are accepted, never raw key strings.
#
# `pubkey` is an optional control-node path to the matching public key. When set,
# host-bootstrap authorizes it for that account on the target; when empty it is
# ignored (keys are never auto-generated).
host_ssh_identities:
  root:
    user: "{{ vault_host_root_user | default('root', true) }}"
    password: "{{ vault_host_root_password | default('', true) }}"
    privkey: "{{ vault_host_root_ssh_privkey_file | default('', true) }}"
    pubkey: "{{ vault_host_root_ssh_pubkey_file | default('', true) }}"
    become: false
  admin:
    user: "{{ vault_host_admin_user | default('admin', true) }}"
    password: "{{ vault_host_admin_password | default('', true) }}"
    privkey: "{{ vault_host_admin_ssh_privkey_file | default('', true) }}"
    pubkey: "{{ vault_host_admin_ssh_pubkey_file | default('', true) }}"
    become: true
  ansible:
    user: "{{ vault_host_ansible_user | default('ansible', true) }}"
    password: "{{ vault_host_ansible_password | default(vault_host_ansible_password_auto | default('', true), true) }}"
    privkey: "{{ vault_host_ansible_ssh_privkey_file | default('', true) }}"
    pubkey: "{{ vault_host_ansible_ssh_pubkey_file | default('', true) }}"
    become: false

host_ssh_identity: "{{ host_ssh_identities['ansible'] }}"
host_ssh_user: "{{ host_ssh_identity.user }}"
host_ssh_password: "{{ host_ssh_identity.password }}"
host_ssh_privkey_file: "{{ host_ssh_identity.privkey }}"
host_ssh_become: "{{ host_ssh_identity.become }}"
# Prefer key, then password, at the SSH layer (single password prompt max).
host_ssh_common_args: "-o PreferredAuthentications=publickey,password -o NumberOfPasswordPrompts=1"

# Ansible connection-plugin interface (fixed names; sourced from host_ssh_*).
ansible_user: "{{ host_ssh_user }}"
ansible_password: "{{ host_ssh_password }}"
ansible_ssh_private_key_file: "{{ host_ssh_privkey_file }}"
ansible_become: "{{ host_ssh_become }}"
ansible_ssh_common_args: "{{ host_ssh_common_args }}"

# --- 'ansible' automation user (created by `make host-bootstrap`) ------------
# host-bootstrap creates/repairs the 'ansible' service account: a password is
# ALWAYS generated into the managed vault unless vault_host_ansible_ssh_pubkey_file
# is set (which switches it to key auth); passwordless sudo is granted, and the
# user is added to the docker group when it exists.
# [OPTIONAL] fixed uid/gid (kept stable across rebuilds). Project-wide scheme:
# shared data identity (5000-5999), service/automation accounts (6000-6499).
host_ansible_uid: 6000
host_ansible_gid: 6000
# [OPTIONAL] docker group to add the automation user to when it exists.
host_ansible_docker_group: docker

# --- Shared connection vault -------------------------------------------------
# The connection identity and its secrets belong to the MACHINE, so all variants
# read/write one vault pair here (overriding the role's per-host default). An
# operator value in vault.yml always wins over its `_auto` fallback in
# vault_managed.yml. Per-variant firmware secrets (root/PPPoE passwords) live in
# each host_vars/<variant>/vault.yml instead.
host_vault_file: "{{ project_root }}/inventory/group_vars/builder/vault.yml"
host_vault_managed_file: "{{ project_root }}/inventory/group_vars/builder/vault_managed.yml"

# Per-variant isolation (scratch/output/artifact directories derived from
# inventory_hostname, and a variant-scoped container name) is a role default so
# it applies consistently whether or not this group_vars file is used; see
# roles/imagebuilder/defaults/main.yml and tasks/setup.yml.
