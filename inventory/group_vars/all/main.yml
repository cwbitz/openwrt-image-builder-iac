---
ansible_core_min_version: "2.19.0"
ansible_core_max_version: "2.20.0"
ansible_core_allow_untested: false

apt_lock_timeout: 900

ssh_identities:
  iac:
    user: "iac"
    password: "{{ vault_host_iac_password | default('', true) }}"
    privkey: "{{ ((ssh_keys | default({}, true)).iac | default({}, true)).privkey | default('', true) }}"
    pubkey: "{{ ((ssh_keys | default({}, true)).iac | default({}, true)).pubkey | default('', true) }}"
    become: false
  admin:
    user: "{{ admin_username | default('admin', true) }}"
    password: "{{ vault_host_admin_password | default('', true) }}"
    privkey: "{{ ((ssh_keys | default({}, true)).admin | default({}, true)).privkey | default('', true) }}"
    pubkey: "{{ ((ssh_keys | default({}, true)).admin | default({}, true)).pubkey | default('', true) }}"
    become: true
  root:
    user: "root"
    password: "{{ vault_host_root_password | default('', true) }}"
    privkey: "{{ ((ssh_keys | default({}, true)).root | default({}, true)).privkey | default('', true) }}"
    pubkey: "{{ ((ssh_keys | default({}, true)).root | default({}, true)).pubkey | default('', true) }}"
    become: false

ssh_identity: "{{ ssh_identities['iac'] }}"
ssh_user: "{{ ssh_identity.user }}"
ssh_password: "{{ ssh_identity.password }}"
ssh_privkey_file: "{{ ssh_identity.privkey }}"
ssh_become: "{{ ssh_identity.become }}"
ssh_common_args: "-o PreferredAuthentications=publickey,password -o NumberOfPasswordPrompts=1"

ansible_user: "{{ ssh_user }}"
ansible_password: "{{ ssh_password }}"
ansible_ssh_private_key_file: "{{ ssh_privkey_file }}"
ansible_become: "{{ ssh_become }}"
ansible_ssh_common_args: "{{ ssh_common_args }}"

# Per-machine connection vault, created by `make prep HOST=<machine>`.
vault_file: "{{ playbook_dir | dirname }}/inventory/host_vars/{{ inventory_hostname }}/vault.yml"
