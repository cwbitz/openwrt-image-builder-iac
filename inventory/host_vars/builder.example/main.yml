---
# Per-machine build variants. Copy this directory to host_vars/<machine>/ (the
# name MUST match the inventory host); it is gitignored. Each list entry is one
# (target, profile, settings) build; keys are optional and fall back to the role
# defaults. Machine-wide settings live in group_vars/builder/main.yml; firmware
# secrets in the vault.yml next to this file, referenced as {{ vault_* }}.

openwrt_variants:
  - name: main
    # [REQUIRED] official ImageBuilder image, e.g.
    # openwrt/imagebuilder:x86-64-25.12.5 (tags: hub.docker.com/r/openwrt/imagebuilder/tags).
    openwrt_image: openwrt/imagebuilder:generic-arm64
    # [OPTIONAL] profile; empty => the target's first profile (`make info` lists them).
    openwrt_profile: ""
    # [OPTIONAL] force a fresh pull of the ImageBuilder image before building.
    openwrt_force_pull: false
    # [OPTIONAL] add/remove from the default module set ('-' removes), or replace
    # it entirely; default set = base system root-password pppoe main-router
    # disable-ipv6 extras.
    openwrt_modules_adjust: []
    openwrt_modules_override: []
    # [OPTIONAL] extra packages ('-' removes), output-filename suffix and image knobs.
    openwrt_extra_packages: []
    openwrt_extra_image_name: "-main"
    openwrt_disabled_services: ""
    openwrt_rootfs_partsize: ""
    # [OPTIONAL] pull built artifacts back to the control node (default true).
    openwrt_fetch_artifacts: true
    # [OPTIONAL] mirrors; include the mirror's OpenWrt prefix for openwrt_mirror.
    openwrt_use_mirror: false
    openwrt_mirror: mirrors.tuna.tsinghua.edu.cn/openwrt
    openwrt_setup_use_mirror: false
    # Module knobs (only the active modules' knobs apply).
    openwrt_main_lan_ip: ""
    openwrt_pppoe_username: ""
    # Firmware secrets are vault dicts keyed by the variant name (this entry: `.main`).
    openwrt_pppoe_password: "{{ (vault_openwrt_pppoe_password | default({})).main | default('', true) }}"
    openwrt_root_password: "{{ (vault_openwrt_root_password | default({})).main | default('', true) }}"
    openwrt_ap_lan_ip: ""
    openwrt_ap_gateway: ""
    openwrt_ap_dns: []
    openwrt_ap_disable_dhcp: false
    openwrt_bypass_lan_ip: ""
    openwrt_bypass_gateway: ""
    openwrt_bypass_dns: []
    openwrt_bypass_disable_dhcp: false

  # A second variant on the same machine; omitted keys use the role defaults.
  - name: side
    openwrt_image: openwrt/imagebuilder:generic-arm64
    openwrt_modules_override: [base, system, root-password, disable-ipv6, extras, bypass-router]
    openwrt_extra_image_name: "-side"
    openwrt_pppoe_password: "{{ (vault_openwrt_pppoe_password | default({})).side | default('', true) }}"
    openwrt_root_password: "{{ (vault_openwrt_root_password | default({})).side | default('', true) }}"
